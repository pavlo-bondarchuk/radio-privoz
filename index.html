<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Радіо Привоз FM — музика, настрій і атмосфера легендарного Привозу."
    >
    <title>Радіо Привоз FM</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    >
    <link rel="icon" type="image/png" href="./favicon.png">
    <link
      rel="stylesheet"
      href="https://cdn.plyr.io/3.7.8/plyr.css"
    >
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="radio">
      <div class="radio__glow radio__glow--top" aria-hidden="true"></div>
      <div class="radio__glow radio__glow--bottom" aria-hidden="true"></div>

      <div class="container">
        <section class="hero" aria-labelledby="radio-title">
          <img
            class="hero__logo"
            src="./logo.png"
            alt="Радіо Привоз FM"
            width="1254"
            height="1254"
          >

          <div class="hero__content">
            <p class="hero__eyebrow" id="radio-title">Скоро здесь будет звучать</p>
            <p class="hero__description">
              Онлайн-радио с музыкой, настроением<br>
              и атмосферой легендарного Привоза
            </p>
          </div>

          <div class="player-shell">
            <span class="player-shell__shine" aria-hidden="true"></span>
            <audio id="player" controls preload="metadata">
              <source src="./audio.mp3" type="audio/mpeg">
              Ваш браузер не підтримує відтворення аудіо.
            </audio>
          </div>
        </section>
      </div>
    </main>

    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
